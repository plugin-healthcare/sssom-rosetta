[project]
name = "sssom-rosetta"
version = "0.1.0"
description = "SSSOM-based mappings of most commonly used information models and vocabularies in Dutch Healthcare."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "csvw>=3.0,<5",
    "markdown>=3.10,<4",
    "polars>=1.42,<2",
    "pydantic>=2.13,<3",
    "rdflib>=7.6,<8",
    "sssom>=0.4.21,<0.5",
    "sssom-schema==1.1.0a5",
    "typer>=0.26,<0.27",
    "tara-dev",
    "networkx>=3,<4",
    "maplib>=0.20.19",
]

[project.scripts]
rosetta = "sssom_rosetta.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
tara-dev = { git = "https://github.com/plugin-healthcare/tara" }
docling-core = { git = "https://github.com/plugin-healthcare/docling-core", branch = "fix/relax-typer-upper-bound" }

[dependency-groups]
dev = [
    "docling>=2.92,<=2.113",
    "docling-core",
    "linkml>=1.11,<2",
    "maplib>=0.20.19",
    "marimo>=0.23.14",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "rust-just>=1.56,<2",
    "ty>=0.0.59",
    "zensical>=0.0.50",
]
docs = [
    "zensical>=0.0.50",
]
[tool.ruff]
line-length = 120
target-version = "py314"
fix = true
# models/sssom.py is generated by linkml-runtime's pydantic generator (see
# AGENTS.md: "regenerated only on a deliberate version bump, never hand-edited")
# and its generated style (mixedCase slots, classmethod validators without
# @classmethod, etc.) doesn't match our lint rules; excluded rather than
# suppressed per-rule since it's never hand-maintained.
exclude = ["examples", "docs", "scripts", "src/sssom_rosetta/models/sssom.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # handled by the formatter
    "ISC001",  # handled by the formatter
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "E501",    # line length is handled by the formatter
    "TD002",   # allow TODOs without an author
    "TD003",   # allow TODOs without an issue link
    "FIX002",  # allow TODO comments to stay
    "TRY003",  # allow long messages in raised exceptions
    "SIM102",  # nested ifs are sometimes clearer
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"src/sssom_rosetta/cli.py" = [
    "PLR0913",  # typer commands take one CLI option per parameter by design
    "FBT002",   # typer boolean flags (e.g. --force) are positional-by-default and idiomatic
]
"src/sssom_rosetta/vocabulary/dhd.py" = [
    "TC003",    # py3.14 target: Path is imported eagerly (no TYPE_CHECKING guard needed)
]
"src/sssom_rosetta/vocabulary/pipeline.py" = [
    "TC001",    # py3.14 target: application types are imported eagerly (no TYPE_CHECKING guard needed)
    "TC003",    # py3.14 target: stdlib types are imported eagerly (no TYPE_CHECKING guard needed)
]
"tests/**/*.py" = [
    "S101",     # asserts are expected in tests
    "S608",     # test SQL is not user input
    "D100",     # docstrings optional in test modules
    "D103",     # docstrings optional in test functions
    "D104",     # docstrings optional in test packages
    "ANN",      # type hints optional in tests
    "INP001",   # tests are not an importable package
    "PLR2004",  # magic values are fine in test assertions
    "PLR0913",  # fixtures push argument counts up
    "SLF001",   # tests may touch private members
    "ARG001",   # unused fixture arguments are common
    "PLC0415",  # local imports are fine in tests
    "TC003",    # py3.14 target: eager stdlib imports (e.g. Path) don't need a TYPE_CHECKING guard
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
addopts = ["-ra", "-q", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = [
    "error",
    # sssom (a third-party dependency of mapping/report.py) sets the now-removed
    # pandas `mode.copy_on_write` option at import time; harmless on pandas>=3.0
    # (CoW is always on), but pandas itself raises this as a warning until it's
    # dropped entirely in pandas 4.0. Not our code to fix.
    "ignore::pandas.errors.Pandas4Warning",
]
testpaths = ["tests"]

[tool.ty.rules]
unused-ignore-comment = "warn"
invalid-return-type = "error"
invalid-argument-type = "error"
division-by-zero = "error"
redundant-cast = "warn"
invalid-method-override = "warn"

[tool.uv]
exclude-newer = "14 days"
